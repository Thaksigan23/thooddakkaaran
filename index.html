<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent Google Auto Translate -->
    <meta name="google" content="notranslate" />

    <!-- Primary SEO: canonical/OG URLs injected at build (see VITE_SITE_URL in .env.example) -->
    <title>Thooddakkaaran | Official Site — Jaffna Farm, Fruits &amp; Natural Products</title>
    <meta
      name="description"
      content="Official website of Thooddakkaaran (Pvt) Ltd — Jaffna-based fruit farm, natural dairy and beverages, wholesale supply, and farming services across Sri Lanka. Product enquiries via contact; retail e-commerce is planned separately."
    />
    <meta
      name="keywords"
      content="Thooddakkaaran, pomegranate farming Sri Lanka, dragon fruit farming, sustainable agriculture Sri Lanka, farm consultation, fruit saplings Sri Lanka"
    />
    <meta name="author" content="Thooddakkaaran Pvt Ltd" />
    <meta name="theme-color" content="#166534" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Thooddakkaaran | Official Site — Jaffna Farm &amp; Products" />
    <meta
      property="og:description"
      content="Official company site: fresh fruit, natural dairy &amp; beverages from our Jaffna farm, plus farmer support and wholesale supply across Sri Lanka."
    />
    <meta property="og:image" content="__SITE_URL__/images/farm1.jpg" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thooddakkaaran" />
    <meta property="og:locale" content="en_LK" />

    <!-- Twitter Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thooddakkaaran | Official Site — Jaffna Farm &amp; Products" />
    <meta
      name="twitter:description"
      content="Official company site: fruit farm, natural products, and agricultural services in Sri Lanka."
    />
    <meta name="twitter:image" content="__SITE_URL__/images/farm1.jpg" />
    <meta name="twitter:site" content="@thooddakkaaran" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Thooddakkaaran Private Limited",
        "url": "__SITE_URL__/",
        "logo": "__SITE_URL__/images/logo.png",
        "email": "info@thooddakkaaran.com",
        "telephone": "+94 70 000 0000",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mirusuvil",
          "addressCountry": "LK"
        },
        "sameAs": ["__INSTAGRAM_URL__"]
      }
    </script>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
